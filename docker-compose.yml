version: '3.1'

volumes:
  quronestpostgresdev:
  quronestrabbitmqdata:


services:

  db:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - quronestpostgresdev:/var/lib/postgresql/data/


  reverseproxy:
    image: nginx:1.27.5
    volumes:
      - ./deployment/dev/proxy_params:/etc/nginx/proxy_params
      - ./deployment/dev/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deployment/dev/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"


  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # app connection
      - "15672:15672" # dashboard
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - quronestrabbitmqdata:/var/lib/rabbitmq
