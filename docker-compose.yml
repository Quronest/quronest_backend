version: '3.1'

volumes:
  quronestpostgresdev:


services:

  db:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - quronestpostgresdev:/var/lib/postgresql/data/


  reverseproxy:
    image: nginx:1.27.5
    volumes:
      - ./deployment/dev/proxy_params:/etc/nginx/proxy_params
      - ./deployment/dev/nginx.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
